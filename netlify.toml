# Netlify configuration - Feasibility Study Company
# Static site (no build step) served from the repository root, plus one
# serverless function that handles the contact form.

[build]
  publish = "."
  functions = "netlify/functions"
  # Lane records (docs/) and page sources (src/) are never published. Netlify
  # matches file paths without regard to case, so the /docs/* 404 rule below
  # alone still served /Docs/... and /DOCS/.... A build from git drops both
  # folders first; a CLI deploy publishes a tree made with
  #   git archive <ref> | tar -x -C <dir> --exclude=docs --exclude=src
  command = "rm -rf docs src"

[build.environment]
  NODE_VERSION = "20"

# The contact form posts to /api/contact. Rewrite that to the function so the
# front-end endpoint stays clean and unchanged.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Lane records under /docs are committed for the owner, not for readers.
# Serve a 404 for them so the repository root can stay the publish directory.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Sources and templates under /src are never served (WEB-FSC-6 keeps page
# sources there), the same way /docs is not.
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

# Retired asset-class paths, kept alive for anything that linked to them. Each
# alias answers 301 to the hub that now covers it. /asset-classes/industrial/
# gets its redirect when the industrial-and-warehouse hub ships, not before.
[[redirects]]
  from = "/asset-classes/car-wash/*"
  to = "/asset-classes/express-car-wash/"
  status = 301

[[redirects]]
  from = "/asset-classes/gas-station/*"
  to = "/asset-classes/gas-station-and-c-store/"
  status = 301

[[redirects]]
  from = "/asset-classes/assisted-living/*"
  to = "/asset-classes/assisted-living-and-memory-care/"
  status = 301

[[redirects]]
  from = "/asset-classes/independent-living/*"
  to = "/asset-classes/assisted-living-and-memory-care/"
  status = 301
